<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estatísticas - Study Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/stats.css">
    <script src="js/chart.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-top">
                <a href="index.html" class="back-btn">← Voltar</a>
                <h1>📊 Estatísticas</h1>
                <a href="ranking.html" class="back-btn">🏆 Ranking</a>
            </div>
            <p>Veja seu progresso nos estudos</p>
        </div>

        <!-- Apenas o KPI de Total, pois o histórico é estático -->
        <div class="kpi-grid" style="grid-template-columns: 1fr; margin-bottom: 20px;">
            <div class="kpi-card">
                <div class="kpi-icon">🏆</div>
                <div class="kpi-value" id="kpiTotal">00:00</div>
                <div class="kpi-label">Tempo Total Salvo</div>
            </div>
        </div>

        <div class="chart-grid">
            <div class="chart-card">
                <div class="chart-title"><span>🥧 Tempo por matéria</span></div>
                <div class="chart-wrapper doughnut-wrapper"><canvas id="subjectChart"></canvas></div>
            </div>
            <div class="chart-card">
                <div class="chart-title"><span>🏅 Ranking de matérias</span></div>
                <div class="ranking-list" id="rankingList">
                    <div class="empty-history">Sem dados ainda</div>
                </div>
            </div>
        </div>

        <div class="chart-card">
            <div class="chart-title"><span>📋 Resumo detalhado por matéria</span></div>
            <div class="subject-table" id="subjectTable">
                <div class="empty-history">Sem dados ainda</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    
    <!-- ⚠️ APENAS o stats.js. Certifique-se de que NÃO existe um <script src="js/script.js"> aqui -->
    <script src="js/stats.js"></script>
</body>
</html>

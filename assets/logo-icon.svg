<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
    <defs>
        <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#667eea"/>
            <stop offset="100%" stop-color="#764ba2"/>
        </linearGradient>
        <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#e0e7ff"/>
        </linearGradient>
    </defs>

    <!-- Fundo arredondado -->
    <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#iconGrad)"/>

    <!-- Brilho no canto -->
    <circle cx="80" cy="20" r="30" fill="#ffffff" opacity="0.08"/>

    <!-- Livro aberto -->
    <g transform="translate(50, 52)">
        <!-- Página esquerda -->
        <path d="M -26,-16 Q -14,-18 0,-10 L 0,18 Q -14,10 -26,12 Z"
              fill="url(#pageGrad)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
        <!-- Página direita -->
        <path d="M 26,-16 Q 14,-18 0,-10 L 0,18 Q 14,10 26,12 Z"
              fill="url(#pageGrad)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
        <!-- Lombada -->
        <line x1="0" y1="-10" x2="0" y2="18" stroke="#4c1d95" stroke-width="2" stroke-linecap="round"/>

        <!-- Linhas de texto (esquerda) -->
        <line x1="-21" y1="-6" x2="-8" y2="-2" stroke="#667eea" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
        <line x1="-21" y1="1" x2="-8" y2="5" stroke="#667eea" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
        <line x1="-21" y1="8" x2="-13" y2="11" stroke="#667eea" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>

        <!-- Linhas de texto (direita) -->
        <line x1="8" y1="-2" x2="21" y2="-6" stroke="#764ba2" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
        <line x1="8" y1="5" x2="21" y2="1" stroke="#764ba2" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
        <line x1="13" y1="11" x2="21" y2="8" stroke="#764ba2" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>

        <!-- Estrela de brilho -->
        <path d="M 18,-20 L 19.8,-15 L 25,-13.2 L 19.8,-11.4 L 18,-6.4 L 16.2,-11.4 L 11,-13.2 L 16.2,-15 Z"
              fill="#fbbf24"/>
    </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
    <defs>
        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#667eea"/>
            <stop offset="100%" stop-color="#764ba2"/>
        </linearGradient>
        <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.85"/>
        </linearGradient>
    </defs>

    <!-- Ícone: livro aberto estilizado -->
    <g transform="translate(0, 0)">
        <!-- Fundo circular do ícone -->
        <circle cx="40" cy="40" r="34" fill="url(#logoGrad)"/>

        <!-- Livro aberto -->
        <g transform="translate(40, 40)">
            <!-- Página esquerda -->
            <path d="M -20,-12 Q -10,-14 0,-8 L 0,14 Q -10,8 -20,10 Z"
                  fill="url(#pageGrad)" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
            <!-- Página direita -->
            <path d="M 20,-12 Q 10,-14 0,-8 L 0,14 Q 10,8 20,10 Z"
                  fill="url(#pageGrad)" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
            <!-- Lombada -->
            <line x1="0" y1="-8" x2="0" y2="14" stroke="#4c1d95" stroke-width="1.5" stroke-linecap="round"/>

            <!-- Linhas de texto (esquerda) -->
            <line x1="-16" y1="-4" x2="-6" y2="-1" stroke="#667eea" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
            <line x1="-16" y1="1" x2="-6" y2="4" stroke="#667eea" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
            <line x1="-16" y1="6" x2="-10" y2="8" stroke="#667eea" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>

            <!-- Linhas de texto (direita) -->
            <line x1="6" y1="-1" x2="16" y2="-4" stroke="#764ba2" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
            <line x1="6" y1="4" x2="16" y2="1" stroke="#764ba2" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
            <line x1="10" y1="8" x2="16" y2="6" stroke="#764ba2" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>

            <!-- Estrelinha/brilho no canto -->
            <path d="M 14,-14 L 15.5,-10 L 19,-8.5 L 15.5,-7 L 14,-3 L 12.5,-7 L 9,-8.5 L 12.5,-10 Z"
                  fill="#fbbf24" opacity="0.95"/>
        </g>
    </g>

    <!-- Texto: Study -->
    <text x="90" y="42"
          font-family="'Poppins', 'Segoe UI', sans-serif"
          font-size="26" font-weight="700"
          fill="#333333">Study</text>

    <!-- Texto: Tracker -->
    <text x="178" y="42"
          font-family="'Poppins', 'Segoe UI', sans-serif"
          font-size="26" font-weight="700"
          fill="url(#logoGrad)">Tracker</text>

    <!-- Subtítulo -->
    <text x="90" y="60"
          font-family="'Poppins', 'Segoe UI', sans-serif"
          font-size="10" font-weight="400"
          fill="#888888" letter-spacing="1.5">CONTADOR DE ESTUDOS</text>
</svg>